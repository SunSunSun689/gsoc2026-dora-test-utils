# dora-test-utils Record/Replay Demo — Baseline YAML (reference)
#
# NOTE: demo_replay.rs generates temp YAMLs with absolute paths at runtime
# (dora spawns nodes from a different working directory).  This file and
# demo-mutated.yml are kept as human-readable reference for the pipeline
# structure.  The actual YAMLs used by the demo are generated in /tmp.
#
# Pipeline: test-source → echo-node → test-sink (all deterministic)
nodes:
  - id: test-source
    path: <absolute>/target/debug/test-source
    args: "--output-id data --data-file <absolute>/demo/demo-source-baseline.json"
    outputs:
      - data

  - id: echo-node
    path: <absolute>/target/debug/echo-node
    inputs:
      data: test-source/data
    outputs:
      - data

  - id: test-sink
    path: <absolute>/target/debug/test-sink
    inputs:
      data: echo-node/data
    args: "--output-file <absolute>/sink_output.json --record-mode"
