[package]
name = "dora-test-utils"
version = "0.1.0"
edition = "2021"
description = "Testing utility library for the DORA framework — unit testing and integration testing support"
license = "Apache-2.0"
repository = "https://github.com/dora-rs/dora-test-utils"
authors = ["SunSunSun689"]

[dependencies]
# CLI argument parsing for test binaries.
clap = { version = "4", features = ["derive"] }

# Error handling for test binaries.
eyre = "0.6"

# Serialization for SinkResult output.
serde = { version = "1", features = ["derive"] }

# DORA node API — the primary integration surface.
#
# Pinned to commit 45436aad by mentor decision (2026-06-01 Weekly Sync,
# Discussion #17).  Uses git dependency (not vendored path) — the crate
# builds from a clean checkout with `cargo fetch` alone.
#
# NodeHarness uses TestingInput::Input (baked events) with deferred node
# construction — no live Channel needed, no vendored patch required.
# Upstream tracking for Channel API: dora-rs/dora#2855.
dora-node-api = { git = "https://github.com/dora-rs/dora.git", rev = "45436aad124fe46463d0b0411e3922dae8ee9ebd" }

# Arrow: must match the version used by the pinned DORA commit.
# 45436aad uses arrow 58; do NOT bump unless the DORA pin changes.
arrow = "58"
arrow-json = "58"

# Flume: used for the output channel (TestingOutput::ToChannel).
# Upstream 45436aad uses flume::Sender for this; we keep it until
# the upstream ToChannel→tokio-mpsc PR (mentor Week 7, Discussion #28)
# is merged.
flume = "0.10"

# Tokio: async runtime used by DORA and our harness.
tokio = { version = "1", features = ["sync", "macros", "rt"] }

# serde_json: DORA outputs are serialized as JSON maps in integration
# testing mode; test code inspects them via serde_json::Value.
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serial_test = "3"

[[bin]]
name = "echo-node"
path = "tests/fixtures/echo-node.rs"
test = false

[[bin]]
name = "classifier-node"
path = "src/bin/classifier_node.rs"

[[bin]]
name = "test-sink"
path = "src/bin/test-sink.rs"

[[bin]]
name = "test-source"
path = "src/bin/test_source.rs"
