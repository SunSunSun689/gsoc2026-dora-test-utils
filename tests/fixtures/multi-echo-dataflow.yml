# Multi-output echo pipeline — test-source emits on two outputs,
# each goes through an echo node to a dedicated sink.
#
# Embodied-AI theme: a Realman GEN72 state stream — data_a carries the
# 7 joint positions (J1..J7) of a configuration, data_b carries the 7
# joint velocities — routed to two consumers.
#
# Verifies multi-output support in test-source and proper routing
# in multi-node dataflows.
#
# Node args are relative to this file's directory (dora spawns nodes
# there), so the file works as-is:
#   dora run tests/fixtures/multi-echo-dataflow.yml --stop-after 15s

nodes:
  - id: test-source
    path: ../../target/debug/test-source
    args: "--output data_a:source-data.json --output data_b:source-velocity.json"
    outputs:
      - data_a
      - data_b

  - id: echo-a
    path: ../../target/debug/echo-node
    inputs:
      data_a: test-source/data_a
    outputs:
      - data_a

  - id: echo-b
    path: ../../target/debug/echo-node
    inputs:
      data_b: test-source/data_b
    outputs:
      - data_b

  - id: test-sink-a
    path: ../../target/debug/test-sink
    inputs:
      data_a: echo-a/data_a
    args: "--expected-file expected-output.json --output-file result-a.json"

  - id: test-sink-b
    path: ../../target/debug/test-sink
    inputs:
      data_b: echo-b/data_b
    args: "--expected-file expected-velocity.json --output-file result-b.json"
